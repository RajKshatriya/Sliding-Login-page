<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento Grid Layout</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <main>
        <section class="bento-grid">
            <div class="lefttop1"></div>
            <div class="top1"></div>
            <div class="top2"></div>
            <div class="righttop1"></div>
            <div class="lefttop2"></div>

            <div class="center">
                <div class="bg-circle">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500&q=80" alt="Model portrait">
                </div>
                <div class="Engagement-rate">
                    <p class="c-percent">19.46%</p>
                    <p>Engagement Rate</p>
                    <p>+102.48%</p>
                </div>
            </div>

            <div class="righttop2">
                <div class="circles-container">
                    <span class="circle circle1"></span>
                    <span class="circle circle2"></span>
                    <span class="circle circle3"></span>
                </div>
                <h2 class="rt2heading">CUBO</h2>
                <p class="rt2subheading">Digital Studio</p>
                <div class="Discoverbutton">
                    <button>
                        Discover more
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 5L16 12L8 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="bottom1"></div>
            <div class="bottom2"></div>
        </section>
    </main>
</body>

</html>
